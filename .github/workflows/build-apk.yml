name: Build APK Direct

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kidsgame-modern-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          flutter create --platforms=android --org com.explapp --no-pub .
          rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Set Android application ID and app name
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/applicationId = "[^"]+"/applicationId = "com.explapp.kidsgame"/' android/app/build.gradle.kts
            grep -q 'applicationId = "com.explapp.kidsgame"' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"[^"]+"/applicationId "com.explapp.kidsgame"/' android/app/build.gradle
            grep -q 'applicationId "com.explapp.kidsgame"' android/app/build.gradle
          else
            echo 'Android app Gradle file was not generated.' >&2
            exit 1
          fi

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ملعب الأطفال"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Run tests when present
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests are present yet.'
          fi

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload validation APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kidsgame-modern-pr
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Copy APK
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p apk/modern
          cp build/app/outputs/flutter-apk/app-release.apk apk/modern/kidsgame.apk
          cat > DOWNLOAD_APK.md <<'EOF'
          # KIDSGAME APK

          Modern Android APK:
          https://github.com/aljwaal1/KIDSGAME/raw/main/apk/modern/kidsgame.apk

          Android 4.4+ legacy APK:
          https://github.com/aljwaal1/KIDSGAME/raw/main/apk/legacy/kidsgame-kitkat.apk
          EOF

      - name: Commit APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add apk/modern/kidsgame.apk DOWNLOAD_APK.md
          git commit -m "Update APK" || echo "No changes"
          git pull --rebase origin main
          git push
