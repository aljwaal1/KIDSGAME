name: Build KitKat APK Separate

on:
  push:
    branches: [ main ]
    paths:
      - 'android_kitkat_java/**'
      - '.github/workflows/build-kitkat-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android_kitkat_java/**'
      - '.github/workflows/build-kitkat-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kidsgame-kitkat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kitkat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build legacy Android 4.4 APK
        working-directory: android_kitkat_java
        run: |
          set +e
          gradle --no-daemon --console plain --stacktrace assembleRelease > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- Gradle failure details ---'
            tail -n 220 gradle-build.log
            exit "$status"
          fi
          tail -n 40 gradle-build.log
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$apk_path" ]; then
            echo 'Legacy APK was not generated.' >&2
            exit 1
          fi
          cp "$apk_path" app/build/outputs/apk/release/kidsgame-kitkat.apk
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitkat-gradle-log
          path: android_kitkat_java/gradle-build.log
          if-no-files-found: warn
      - name: Upload validation APK
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kidsgame-kitkat-pr
          path: android_kitkat_java/app/build/outputs/apk/release/kidsgame-kitkat.apk
          if-no-files-found: error
      - name: Publish separate legacy APK
        if: github.event_name != 'pull_request' && success()
        run: |
          mkdir -p apk/legacy
          cp android_kitkat_java/app/build/outputs/apk/release/kidsgame-kitkat.apk apk/legacy/kidsgame-kitkat.apk
      - name: Commit legacy APK only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk/legacy/kidsgame-kitkat.apk
          git commit -m "Update KitKat APK" || exit 0
          git pull --rebase origin main
          git push
