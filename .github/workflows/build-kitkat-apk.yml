name: Build KitKat APK Separate

on:
  push:
    branches: [ legacy-android-4.4 ]
    paths:
      - 'android_kitkat_java/**'
      - '.github/workflows/build-kitkat-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kidsgame-kitkat-legacy-android-4.4
  cancel-in-progress: true

jobs:
  build-kitkat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy-android-4.4
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build legacy Android 4.4 APK
        shell: bash
        working-directory: android_kitkat_java
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease --stacktrace 2>&1 | tee ../kidsgame-kitkat-build.log
      - name: Publish separate legacy APK
        run: |
          set -euo pipefail
          APK="android_kitkat_java/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p apk/legacy
          cp "$APK" apk/legacy/kidsgame-kitkat.apk
          rm -f apk/legacy/kidsgame-kitkat-build-failure.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kidsgame-kitkat-android-4.4
          path: apk/legacy/kidsgame-kitkat.apk
      - name: Commit legacy APK only
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A apk/legacy
          git diff --cached --quiet || git commit -m "Build KitKat APK with interaction sounds"
          git pull --rebase origin legacy-android-4.4
          git push origin HEAD:legacy-android-4.4
      - name: Preserve build failure log
        if: failure()
        run: |
          mkdir -p apk/legacy
          cp kidsgame-kitkat-build.log apk/legacy/kidsgame-kitkat-build-failure.log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk/legacy/kidsgame-kitkat-build-failure.log
          git diff --cached --quiet || git commit -m "Record KitKat build failure"
          git pull --rebase origin legacy-android-4.4
          git push origin HEAD:legacy-android-4.4
