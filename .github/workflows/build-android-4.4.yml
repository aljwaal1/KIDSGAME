name: Build Kids Game Android 4.4

on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths:
      - 'legacy-android-4.4/**'
      - '.github/workflows/build-android-4.4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build legacy APK
        run: gradle -p legacy-android-4.4 assembleRelease

      - name: Copy APK
        run: |
          mkdir -p apk
          cp legacy-android-4.4/app/build/outputs/apk/release/app-release.apk apk/kidsgame-android-4.4.apk

      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/kidsgame-android-4.4.apk
          git commit -m "Build Kids Game Android 4.4 APK" || true
          git push origin android-4.4
