plugins { id 'com.android.application' }

android {
    namespace 'com.explapp.kidsgamelegacy'
    compileSdk 33

    defaultConfig {
        applicationId 'com.explapp.kidsgamelegacy'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '1.0.0-legacy'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
