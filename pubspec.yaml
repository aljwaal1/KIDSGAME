name: kids_games_arena
description: Arabic kids games app with thinking and learning games.
publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dependency_overrides:
  # jni 1.0.1 currently fails while evaluating its Android Gradle script.
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon_legacy.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
